apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: springboot_db
            - name: MYSQL_ROOT_PASSWORD
              value: "Man@7720#7220"
          volumeMounts:
            - name: mysql-volume
              mountPath: /var/lib/mysql         # MySQL data path
      volumes:
        - name: mysql-volume
          hostPath:
            path: /data/mysql                   # Store on node disk
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  selector:
    app: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
